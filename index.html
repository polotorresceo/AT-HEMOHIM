<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomy HIM Antienvejecimiento</title>
<meta name="description" content="Conoce Atomy HIM y resuelve tus dudas con información clara y directa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--rojo:#C62828;--rojo-osc:#B71C1C;--tx:#212121;--gris:#F6F6F6;--borde:#E6E6E6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#FFFFFF;color:var(--tx);font-family:'Inter',Montserrat,Roboto,Arial,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--rojo)}
.wrap{max-width:1000px;margin:0 auto}
h1,h2{color:var(--rojo);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0}
h3{margin:0 0 8px;font-size:20px;color:var(--tx)}

.top{padding:18px 20px;border-bottom:1px solid var(--borde)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.top .wrap .mini+.mini{margin-left:-4px}
.logo{font-weight:800;color:var(--rojo);text-decoration:none;font-size:18px}
.top a.mini{font-weight:600;text-decoration:none;color:var(--tx)}
.top a.mini:hover{color:var(--rojo)}

.hero{text-align:center;padding:88px 20px 72px;border-bottom:4px solid var(--rojo)}
.hero h1{font-size:clamp(34px,6.4vw,62px);max-width:820px;margin:0 auto 22px}
.hero p{max-width:640px;margin:0 auto 34px;font-size:clamp(17px,2.4vw,21px)}
.btn{display:inline-block;background:var(--rojo);color:#FFFFFF;font-weight:800;font-size:18px;padding:18px 44px;border-radius:10px;text-decoration:none;box-shadow:0 8px 22px rgba(198,40,40,.3);transition:background .15s}
.btn:hover{background:var(--rojo-osc)}
.btn:focus-visible,a:focus-visible{outline:3px solid #111;outline-offset:3px}
.note{display:block;margin-top:14px;font-size:14px;color:#555}

section{padding:72px 20px}
section.alt{background:var(--gris)}
section h2{text-align:center;font-size:clamp(26px,4vw,38px);margin-bottom:12px}
.sub{text-align:center;max-width:620px;margin:0 auto 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:#FFFFFF;border:1px solid var(--borde);border-top:4px solid var(--rojo);border-radius:12px;padding:26px 24px}
.card p{margin:0}
blockquote{margin:0;font-style:italic}
cite{display:block;margin-top:14px;font-style:normal;font-weight:700;color:var(--rojo)}

.cta{background:var(--rojo);text-align:center;padding:72px 20px}
.cta h2{color:#FFFFFF}
.cta p{color:#FFFFFF;max-width:580px;margin:14px auto 30px}
.cta .btn{background:#FFFFFF;color:var(--rojo);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.cta .btn:hover{background:#111;color:#FFFFFF}

footer{background:#111;color:#FFFFFF;text-align:center;padding:28px 20px;font-size:14px}
</header>

<main id="inicio">
  <div class="hero">
    <div class="wrap">
      <h1>Atomy HIM Antienvejecimiento</h1>
      <p>Escribe aquí en una o dos frases qué ofreces y qué gana la persona que te contacta.</p>
      <!-- Cambia este enlace por tu WhatsApp o formulario -->
      <a class="btn" href="http://atomy-hipertension.blogspot.com/">Quiero saber más</a>
      <span class="note">Información clara, sin compromiso</span>
    </div>
  </div>

  <section id="entradas">
    <div class="wrap">
      <h2>Videos y entradas</h2>
      <p class="sub">Mira el video y solicita tu consulta sin costo.</p>
      <div class="entradas">

        <!-- ===== ENTRADA: copia desde aquí hasta "FIN ENTRADA" para agregar otra ===== -->
        <article class="entrada">
          <div class="entrada-head">
            <h3>Hemohim: conoce los productos de HIM</h3>
            <span class="fecha">Video informativo</span>
          </div>
          <div class="video">
            <iframe 
        </article>
        <!-- ===== FIN ENTRADA ===== -->
        <!-- Nota: en una segunda entrada cambia los id/for (name, whatsapp) por otros únicos, p. ej. name2 y whatsapp2 -->

      </div>
    </div>
  </section>

  <section class="alt" id="beneficios">
    <div class="wrap">
      <h2>Beneficios principales</h2>
      <p class="sub">Resume en una frase por qué tu propuesta marca la diferencia.</p>
      <div class="grid">
        <div class="card"><h3>Beneficio uno</h3><p>Describe el primer beneficio de forma breve y concreta.</p></div>
        <div class="card"><h3>Beneficio dos</h3><p>Describe el segundo beneficio de forma breve y concreta.</p></div>
        <div class="card"><h3>Beneficio tres</h3><p>Describe el tercer beneficio de forma breve y concreta.</p></div>
      </div>
    </div>
  </section>

  <section id="testimonios">
    <div class="wrap">
      <h2>Lo que dicen nuestros clientes</h2>
      <p class="sub">Reemplaza estos espacios con testimonios reales y autorizados.</p>
      <div class="grid">
        <div class="card"><blockquote>“Testimonio real del cliente 1.”</blockquote><cite>Nombre, ciudad</cite></div>
        <div class="card"><blockquote>“Testimonio real del cliente 2.”</blockquote><cite>Nombre, ciudad</cite></div>
        <div class="card"><blockquote>“Testimonio real del cliente 3.”</blockquote><cite>Nombre, ciudad</cite></div>
      </div>
    </div>
  </section>

  <div class="cta">
    <div class="wrap">
      <h2>¿Listo para dar el siguiente paso?</h2>
      <p>Contáctanos hoy y resolvemos todas tus dudas.</p>
      <!-- Cambia este enlace por tu WhatsApp o formulario -->
      <a class="btn" href="http://atomy-hipertension.blogspot.com/">Contáctanos ahora</a>
    </div>
  </div>
</main>

<footer>
  © Atomy HIM Antienvejecimiento · <a href="http://atomy-hipertension.blogspot.com/">Blog</a>
</footer>

</body>
</html>
